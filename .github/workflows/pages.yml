name: Website Pages

# The website is independent of desktop application builds.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The displayed version comes from the latest Amadeus tag, which does not push to this repository.
  # The Amadeus release workflow can send an "amadeus-release" dispatch for an immediate refresh;
  # the schedule is a fallback.
  repository_dispatch:
    types: [amadeus-release]
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
